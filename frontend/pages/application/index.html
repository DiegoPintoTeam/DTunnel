<!DOCTYPE html>
<html lang="pt-BR" translate="no" data-bs-theme="light">

<head>
  <base href="/" target="_blank">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="google" content="notranslate">
  <script>
    (() => {
      const themes = ['enterprise', 'carbon', 'oceanic', 'crimson', 'forest', 'solar', 'oscuro', 'dia'];
      const stored = localStorage.getItem('dtunnel-theme') || 'enterprise';
      const now = new Date();
      const key = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
      let hash = 0;
      for (let i = 0; i < key.length; i += 1) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
      const chosen = stored === 'random_daily' ? themes[hash % themes.length] : themes.includes(stored) ? stored : 'enterprise';
      const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
      const bsTheme = localStorage.getItem('bs-theme') || (prefersDark ? 'dark' : 'light');
      document.documentElement.classList.add('theme-preload', 'theme-' + chosen);
      document.documentElement.setAttribute('data-bs-theme', bsTheme === 'auto' && prefersDark ? 'dark' : bsTheme);
    })();
  </script>
  <link rel="shortcut icon" href="../static/img/favicon.svg" />
  <title>DTunnel Pro - Aplicativo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/bootstrap.css">
  <link rel="stylesheet" href="/static/css/sidebar.css?v=2">
  <link rel="stylesheet" href="/static/css/header.css?v=6">
  <link rel="stylesheet" href="/static/css/app_config_custom.css">
  <link rel="stylesheet" href="/static/css/themes.css?v=17">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror-one-dark-theme@1.1.1/one-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/hint/show-hint.min.css">
  <script src="/static/js/dark_light.js?v=3"></script>
  <meta name="csrf-token" content="<%= it.csrfToken %>">
</head>

<body>
  <main class="d-flex">
    <%~ include("./sidebar", it) %>
    <div class="container-fluid p-0">
      <%~ include("./header", it) %>
      <div class="content pt-1 overflow-auto">
        <div class="row m-auto mb-3 center-column" id="app">
        </div>
        <div class="d-flex justify-content-center align-items-center mt-5" id="loading">
          <div class="spinner-border p-5" role="status">
            <span class="sr-only"></span>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../static/js/sidebar.js"></script>
  <script src="../static/js/utils.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/css/css.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/hint/javascript-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/lint/javascript-lint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/hint/html-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/lint/html-lint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/hint/xml-hint.min.js"></script>
  <script>
    const createEditor = ({
      element,
      value,
      onchange,
      onload
    }) => {
      const editor = CodeMirror(element, {
        value: value,
        mode: 'htmlmixed',
        theme: 'one-dark',
        lineNumbers: true,
        extraKeys: {
          'F11': cm => cm.setOption('fullScreen', !cm.getOption('fullScreen')),
          'Esc': cm => cm.setOption('fullScreen', false),
          'Ctrl-Space': 'autocomplete',
        },
      });
      editor.on('change', editor => onchange(editor.doc.getValue()));
      editor.setSize('100%', '100%');
      editor.getWrapperElement().style['font-size'] = '12px';
      editor.refresh();
      onload();
    }
  </script>
  <script src="../static/js/jscolor.js"></script>
  <script type="module" src="../static/js/app_config/main.js"></script>
</body>

</html>
