<!DOCTYPE html>
<html lang="pt-BR" translate="no" data-bs-theme="light">

<head>
  <base href="/" target="_blank">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="google" content="notranslate">
  <script>
    (() => {
      const themes = ['enterprise', 'carbon', 'oceanic', 'crimson', 'forest', 'solar', 'oscuro', 'dia'];
      const stored = localStorage.getItem('dtunnel-theme') || 'enterprise';
      const now = new Date();
      const key = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
      let hash = 0;
      for (let i = 0; i < key.length; i += 1) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
      const chosen = stored === 'random_daily' ? themes[hash % themes.length] : themes.includes(stored) ? stored : 'enterprise';
      const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
      const bsTheme = localStorage.getItem('bs-theme') || (prefersDark ? 'dark' : 'light');
      document.documentElement.classList.add('theme-preload', 'theme-' + chosen);
      document.documentElement.setAttribute('data-bs-theme', bsTheme === 'auto' && prefersDark ? 'dark' : bsTheme);
    })();
  </script>
  <link rel="shortcut icon" href="../static/img/favicon.svg" />
  <title>DTunnel Pro - Textos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="../static/css/styles.css">
  <link rel="stylesheet" href="../static/css/bootstrap.css">
  <link rel="stylesheet" href="../static/css/sidebar.css?v=2">
  <link rel="stylesheet" href="../static/css/header.css?v=6">
  <link rel="stylesheet" href="../static/css/themes.css?v=16">
  <script src="../static/js/dark_light.js?v=3"></script>
  <meta name="csrf-token" content="<%= it.csrfToken %>">
</head>

<body>
  <main class="d-flex">
    <%~ include("./sidebar", it) %>
    <div class="container-fluid p-0">
      <%~ include("./header", it) %>
      <div class="content pt-1 overflow-auto">
        <div class="card shadow border border-0 overflow-auto">
          <div class="card-body m-0">
            <div class="d-md-flex justify-content-between mb-3">
              <div class="d-flex flex-column mb-1">
                <h1 class="h3 mb-4 text-gray-800">Textos</h1>
                <div>
                  <div class="input-group mb-1">
                    <input class="form-control border" type="search" id="search" name="search" placeholder="Buscar" value>
                    <button class="input-group-text border border-start-0 ms-0" type="button">
                      <i class="fas fa-magnifying-glass"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="col-md-3">
                <div class="d-flex justify-content-center justify-content-lg-end mb-1">
                  <a class="btn btn-danger w-100 me-1" id="reset_texts">
                    <i class="fas fa-trash"></i>
                    <span>Resetar</span>
                  </a>
                </div>
                <div class="d-flex justify-content-center justify-content-lg-end mb-1">
                  <button class="btn btn-dark w-100 me-1 opacity-75" type="button" id="import_texts">
                    <i class="fas fa-upload"></i>
                    <span>Importar</span>
                  </button>
                  <button class="btn btn-dark w-100 opacity-75" type="button" id="export_texts">
                    <i class="fas fa-download"></i>
                    <span>Exportar</span>
                  </button>
                  <input type="file" id="import_texts_file" accept="application/json,.json" hidden>
                </div>
              </div>
            </div>
            <div class="table-responsive text-center">
              <div class="d-flex justify-content-center align-items-center">
                <div class="__spinner">
                  <div class="spinner-border text-light p-4 mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                </div>
              </div>
              <table class="table table-striped mb-3" id="table" style="display: none;">
                <thead>
                  <tr>
                    <th scope="col" class="border-0">ID</th>
                    <th scope="col" class="border-0">Texto</th>
                    <th scope="col" class="border-0">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="modal fade" id="modal-text" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">EDITAR TEXTO</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body text-start">
                <div>
                  <div class="row">
                    <input class="form-control" hidden id="id" name="id" type="text" value>
                    <div class="col-md-12 mb-3">
                      <label class="form-label" for="label">Nombre de la etiqueta</label>
                      <input class="form-control" disabled id="label" name="label" type="text" value>
                    </div>
                    <div class="col-md-12 mb-3">
                      <label for="color" class="form-label">Previsualización</label>
                      <div class="form-control __preview"></div>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="text">Texto</label>
                    <textarea class="form-control" id="text" maxlength="1024" minlength="1" name="text" required rows="5"></textarea>
                  </div>
                  <div class="mb-3 d-flex justify-content-center">
                    <div class="form-check me-3">
                      <input class="form-check-input __bold" type="checkbox">
                      <label class="form-check-label">Negrito</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input __italic" type="checkbox">
                      <label class="form-check-label">Itálico</label>
                    </div>
                  </div>
                  <div class="modal-footer p-0 pt-2">
                    <div class="d-flex flex-fill justify-content-end">
                      <botton type="button" class="btn-responsive w-100 me-2 __apply_color">
                        COLOR
                      </botton>
                      <button type="button" class="btn-responsive w-100 me-2" data-bs-dismiss="modal">Cerrar</button>
                      <button type="button" class="btn-responsive w-100" data-bs-dismiss="modal" id="btnSave">Guardar</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../static/js/sidebar.js"></script>
  <script src="../static/js/utils.js"></script>
  <script src="../static/js/jscolor.js"></script>

  <script type="module" src="../static/js/picker.js"></script>
  <script>
    let rows;

    const spinner = document.querySelector('.__spinner');
    const table = document.querySelector('#table');

    const showSpinner = () => {
      spinner.style.display = 'block';
      table.style.display = 'none';
    }
    const closeSpinner = () => {
      spinner.style.display = 'none';
      table.style.display = 'block';
    };

    const loadTextList = async () => {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);

      try {
        showSpinner();

        const response = await fetch('/texts_list', {
          method: 'GET',
          headers: {},
          signal: controller.signal,
        });
        if (!response.ok) {
          throw new Error(`No se pudieron obtener los textos (${response.status})`);
        }

        const data = await response.json();
        if (!Array.isArray(data.data)) {
          throw new Error('Respuesta inválida al obtener textos');
        }

        const tableBody = document.getElementById('table').getElementsByTagName('tbody')[0];
        tableBody.replaceChildren();

        data.data.forEach((value) => {

          const json = JSON.stringify({
            id: value.label,
            label: value.label,
            text: value.text,
            user_id: data.user_id
          });

          let action = '';
          action += `<input type="hidden" id="text_${value.label}" value="${encodeURIComponent(json)}"><tr>`;
          action += `<div class="table-actions">`;
          action += `<button class="btn btn-dark table-action-btn" title="Editar" data-bs-toggle="modal" data-bs-target="#modal-text" data-bs-text-id="${value.label}">`;
          action += `<i class="fas fa-pen-to-square"></i></button>`;
          action += `<a class="btn btn-dark table-action-btn" title="Resetar">`;
          action += `<i class="fas fa-trash" onclick='resetText("${value.label}");'></i></a>`;
          action += `<button class="btn btn-dark table-action-btn" title="Copiar" onclick="copyText('${value.text}')">`;
          action += `<i class="fas fa-clipboard"></i></button>`;
          action += `</div>`;

          const row = tableBody.insertRow();
          row.insertCell(0).textContent = value.id;
          row.insertCell(1).textContent = value.text;
          row.insertCell(2).innerHTML = action;

        });

        rows = $('#table > tbody > tr');

      } catch (err) {
        showToastError('No se pueden obtener textos')
      } finally {
        clearTimeout(timeout);
        closeSpinner();
      }
    }

    loadTextList();

    const buttonSave = document.getElementById("btnSave");
    buttonSave.addEventListener('click', async e => {

      const id = document.getElementById("id").value;
      const text = document.getElementById("text").value;

      try {

        const response = await fetch('/texts/update', {
          method: 'PUT',
          body: JSON.stringify({
            label: id,
            text
          }),
          headers: {
            'Content-Type': 'application/json',
          }
        });

        if (response.status == 200) {
          showToastSuccess('Texto actualizado con éxito!')
          setTimeout(() => loadTextList(), 1000);
          return;
        }
        const data = await response.json();
        if (data.message) {
          showToastError(data.message);
        }

      } catch (err) {
        showToastError('No se pudo actualizar el texto')
      }
    });

    const resetTexts = document.getElementById("reset_texts");
    resetTexts.addEventListener('click', e => {
      showAlertConfirm(async () => {
        try {

          const response = await fetch('/texts/reset', {
            method: 'DELETE',
            headers: {},
          });

          if (response.status === 204) {
            showToastSuccess('Éxito, todos textos reseteados!');
            setTimeout(() => loadTextList(), 1000);
            return
          }

          const data = await response.json();
          if (data.message) {
            showToastError(data.message);
          }

        } catch (e) {
          showToastError("No se pudo restablecer los textos!");
        }
      })
    });

    const resetText = async (label) => {
      try {

        const response = await fetch('/text/reset', {
          method: 'PUT',
          body: JSON.stringify({
            label
          }),
          headers: {
            'Content-Type': 'application/json'
          },
        });

        if (response.status === 200) {
          showToastSuccess(`Éxito, ${label} restablecido!`);
          setTimeout(() => loadTextList(), 1000);
          return;
        }

        const data = await response.json();
        if (data.message) {
          showToastError(data.message);
        }

      } catch (err) {
        showToastError(`No se pudo restablecer ${label}`);
      }
    }

    const getColorFromFont = (text) => {
      const pattern = /<font color="(.*)">(.*)<\/font>/g;
      const result = pattern.exec(text);
      if (result) {
        return result[1];
      }
      return null;
    }

    const replaceTextColor = (text, color) => {
      const pattern = /<font color="(.*)">(.*)<\/font>/g;
      if (!pattern.exec(text)) {
        return `<font color="${color}">${text}</font>`;
      }
      const result = text.replace(pattern, `<font color="${color}">$2</font>`);
      return result;
    }

    const setTextBold = (text) => {
      const pattern = /<b>(.*)<\/b>/g;
      if (text.match(pattern)) {
        const result = text.replace(pattern, `$1`);
        return result;
      }
      return `<b>${text}</b>`;
    }

    const setTextItalic = (text) => {
      const pattern = /<i>(.*)<\/i>/g;
      if (text.match(pattern)) {
        const result = text.replace(pattern, `$1`);
        return result;
      }
      return `<i>${text}</i>`;
    }

    const setPreview = (text) => {
      const preview = document.querySelector('.__preview');
      preview.innerHTML = text;
    }

    const applyColor = document.querySelector('.__apply_color');
    applyColor.addEventListener('click', () => {
      const div = document.createElement('div');
      const color = new jscolor(div);
      color.onInput = () => {
        const text = document.querySelector('#text');
        text.value = replaceTextColor(text.value, color.toHEXString());
        setPreview(text.value);
      }
      color.onClose = () => div.remove();
      applyColor.insertAdjacentElement('beforebegin', div);

      const c = getColorFromFont(text.value);
      if (c) color.fromString(c);
      color.show();
    })

    const bold = document.querySelector('.__bold');
    bold.addEventListener('click', () => {
      const text = document.querySelector('#text');
      text.value = setTextBold(text.value);
      setPreview(text.value);
    })

    const italic = document.querySelector('.__italic');
    italic.addEventListener('click', () => {
      const text = document.querySelector('#text');
      text.value = setTextItalic(text.value);
      setPreview(text.value);
    })

    $(document).ready(function() {
      $('#modal-text').on('show.bs.modal', function(event) {

        const text_id = event.relatedTarget.getAttribute('data-bs-text-id')
        const text = JSON.parse(decodeURIComponent($('#text_' + text_id).val()))
        const div = $('#modal-text div')

        $('#id').attr('value', text_id)

        bold.checked = text.text.match(/<b>(.*)<\/b>/g) ? true : false;
        italic.checked = text.text.match(/<i>(.*)<\/i>/g) ? true : false;

        div.find('input[name="label"]').val(text.label)
        div.find('textarea[name="text"]').val(text.text)
        div.find('.__preview').html(text.text)
      });
    });

    $('#search').on('input', function() {
      const val = $.trim($(this).val()).replace(/ +/g, ' ').toLowerCase();
      rows.show().filter(function() {
        const text = $(this).text().replace(/\s+/g, ' ').toLowerCase();
        return !~text.indexOf(val);
      }).hide();
    })

    const importTextsButton = document.getElementById('import_texts');
    const importTextsFile = document.getElementById('import_texts_file');
    const exportTextsButton = document.getElementById('export_texts');

    importTextsButton.addEventListener('click', () => importTextsFile.click());
    importTextsFile.addEventListener('change', async () => {
      const file = importTextsFile.files[0];
      importTextsFile.value = '';

      if (!file) return;

      try {
        const imported = JSON.parse(await file.text());
        const texts = Array.isArray(imported) ? imported : imported.texts;

        if (!Array.isArray(texts) || texts.length === 0 || texts.some((item) => (
          !item || typeof item.label !== 'string' || typeof item.text !== 'string'
        ))) {
          throw new Error('Formato inválido');
        }

        showAlertConfirm(async () => {
          try {
            await Promise.all(texts.map((item) => fetch('/texts/update', {
              method: 'PUT',
              body: JSON.stringify({ label: item.label, text: item.text }),
              headers: { 'Content-Type': 'application/json' },
            }).then((response) => {
              if (!response.ok) throw new Error('No se pudo actualizar un texto');
            })));

            showToastSuccess('Textos importados con éxito!');
            await loadTextList();
          } catch (error) {
            showToastError('No se pudieron importar los textos');
          }
        });
      } catch (error) {
        showToastError('El archivo de textos no es válido');
      }
    });

    exportTextsButton.addEventListener('click', async () => {
      try {
        const response = await fetch('/texts_list');
        if (!response.ok) throw new Error('No se pudieron obtener los textos');

        const data = await response.json();
        const file = new Blob([JSON.stringify({ version: 1, texts: data.data }, null, 2)], {
          type: 'application/json',
        });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(file);
        link.download = 'textos.json';
        link.click();
        URL.revokeObjectURL(link.href);
      } catch (error) {
        showToastError('No se pudieron exportar los textos');
      }
    });

    function copyText(text) {
      var $temp = $("<input>");
      $("body").append($temp);
      $temp.val(text).select();
      document.execCommand("copy");
      $temp.remove();
    }
  </script>
</body>

</html>
